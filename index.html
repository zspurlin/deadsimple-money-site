<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dead Simple</title>
  <meta name="description" content="Investment research, graded and tracked. Every call is a card with a Dead Simple Score and live alpha vs the S&P 500. No hype. No noise. Just signal." />
  <meta name="theme-color" content="#05070c" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dead Simple" />
  <meta property="og:description" content="Investment research, graded and tracked. Alpha vs the S&P 500 on every call." />
  <meta property="og:url" content="https://deadsimple.money/" />
  <meta property="og:site_name" content="Dead Simple" />
  <meta property="og:image" content="https://deadsimple.money/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dead Simple" />
  <meta name="twitter:description" content="Investment research, graded and tracked. Alpha vs the S&P 500 on every call." />
  <meta name="twitter:site" content="@DeadSimpleMoney" />
  <meta name="twitter:image" content="https://deadsimple.money/assets/og-image.png" />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="canonical" href="https://deadsimple.money/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" />

  <style>
    :root {
      --bg: #05070c;
      --panel: #0d1320;
      --hairline: #223049;
      --text: #eef2f8;
      --muted: #93a1b8;
      --faint: #5d6b85;
      --accent: #3d82e8;
      --pos: #57d08a;
      --neg: #ff6b6b;
      --serif: "Playfair Display", "Didot", "Bodoni 72", Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(80% 50% at 50% 0%, rgba(61,130,232,0.10), rgba(0,0,0,0) 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 3rem 1.25rem 5rem; }

    /* Header */
    header { text-align: center; margin-bottom: 2.5rem; }
    .brand { display: inline-flex; align-items: center; gap: 0.7rem; }
    .brand img { width: 46px; height: 46px; display: block; }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 4rem);
      letter-spacing: -0.01em;
      margin: 0;
      color: #fafafa;
    }
    .accent-rule { width: 36px; height: 2px; margin: 1.1rem auto; background: var(--accent); border: 0; }
    .tagline {
      font-style: italic; font-weight: 600; color: var(--muted);
      margin: 0 0 0.4rem; font-size: clamp(1.15rem, 3vw, 1.4rem);
    }
    .subline {
      color: var(--faint); margin: 0; font-size: 0.95rem;
      letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* Tabs */
    nav.tabs {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem;
      margin: 2.5rem 0 2rem; border-bottom: 1px solid var(--hairline);
    }
    .tab {
      background: none; border: 0; color: var(--muted); font: inherit;
      font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.8rem 1.2rem; cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: color 150ms ease, border-color 150ms ease;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab .count {
      display: inline-block; margin-left: 0.4rem; font-size: 0.75rem;
      color: var(--faint); font-variant-numeric: tabular-nums;
    }

    /* Gallery */
    .gallery {
      display: grid; gap: 1.6rem;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }
    .tile {
      display: block; text-decoration: none; color: inherit;
      transition: transform 160ms ease;
    }
    .tile:hover { transform: translateY(-4px); }
    .tile img {
      width: 100%; aspect-ratio: 5 / 7; object-fit: cover;
      border-radius: 14px; border: 1px solid var(--hairline);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: block;
    }
    .tile-meta {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-top: 0.7rem; padding: 0 0.2rem;
    }
    .tile-alpha { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile-alpha.pos { color: var(--pos); }
    .tile-alpha.neg { color: var(--neg); }
    .tile-alpha.flat { color: var(--muted); }
    .tile-sub { font-size: 0.78rem; color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; }
    .tile-alpha-label { font-size: 0.7rem; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; display: block; }
    .tile-meta .right { text-align: right; }
    .tile-ret { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile-ret.pos { color: var(--pos); } .tile-ret.neg { color: var(--neg); } .tile-ret.flat { color: var(--muted); }

    /* Track-record strip: the public scoreboard, computed from index.json. */
    .track-record {
      display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(1.6rem, 6vw, 3.2rem);
      max-width: 620px; margin: 0 auto 0.5rem; padding: 1.1rem 1.6rem;
      border: 1px solid var(--hairline); border-radius: 14px;
      background: rgba(13, 19, 32, 0.55);
    }
    .track-record[hidden] { display: none; }
    .stat { text-align: center; }
    .stat .v { display: block; font-size: 1.55rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.1; }
    .stat .v.pos { color: var(--pos); }
    .stat .v.neg { color: var(--neg); }
    .stat .k { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }

    /* Card lightbox: open the flip card in-page instead of navigating away. */
    .lightbox {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; padding: 2vh 2vw;
      background: rgba(2, 4, 8, 0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .lightbox.open { display: flex; }
    .lightbox iframe {
      /* Size to card.html's full footprint: the card PLUS its own slim chrome
         (~56px flip-hint reserve) and 0.98 width margin, so the embedded fit()
         doesn't shrink the card a second time. Mirrors card.html's fit()
         constants so the clicked card is a large presentation view that nearly
         fills the viewport; the lightbox's backdrop blur fills the side margins. */
      width:  min(98vw, calc((96vh - 56px) * 1080 / 1512 / 0.98));
      height: min(96vh, calc(98vw * 0.98 * 1512 / 1080 + 56px));
      border: 0; border-radius: 18px; background: transparent;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .lightbox-close {
      position: absolute; top: 1.1rem; right: 1.3rem;
      width: 44px; height: 44px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--hairline); background: rgba(13, 19, 32, 0.85);
      color: var(--text); font-size: 1.5rem; line-height: 1;
      transition: color 150ms ease, border-color 150ms ease;
    }
    .lightbox-close:hover, .lightbox-close:focus-visible { color: #fff; border-color: var(--accent); outline: none; }
    body.no-scroll { overflow: hidden; }

    .empty {
      text-align: center; color: var(--muted); padding: 4rem 1rem;
      border: 1px dashed var(--hairline); border-radius: 16px;
    }
    .empty strong { color: var(--text); display: block; margin-bottom: 0.4rem; font-size: 1.1rem; }

    /* Top-right About link */
    .top-nav { position: absolute; top: 1.4rem; right: 1.4rem; z-index: 5; }
    .top-nav a {
      display: inline-block; padding: 0.55rem 1.2rem;
      border: 1px solid var(--accent); border-radius: 999px;
      color: var(--text); background: rgba(61, 130, 232, 0.12);
      text-decoration: none; font-size: 0.85rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: color 150ms ease, border-color 150ms ease, background 150ms ease;
    }
    .top-nav a:hover, .top-nav a:focus-visible {
      color: #fff; background: rgba(61, 130, 232, 0.28); outline: none;
    }
    /* Phones: tuck the pill into the corner so it clears the wordmark. */
    @media (max-width: 640px) {
      .top-nav { top: 0.6rem; right: 0.6rem; }
      .top-nav a { padding: 0.4rem 0.9rem; font-size: 0.75rem; }
    }

    /* Footer */
    footer { text-align: center; margin-top: 4rem; }
    nav.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
    nav.links a {
      display: inline-block; padding: 0.6rem 1.2rem; border: 1px solid var(--hairline);
      color: var(--muted); text-decoration: none; font-size: 0.82rem;
      letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px;
      transition: color 150ms ease, border-color 150ms ease;
    }
    nav.links a:hover, nav.links a:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
    .foot-note { color: var(--faint); font-size: 0.8rem; margin-top: 1.4rem; }
  </style>
</head>
<body>
  <nav class="top-nav" aria-label="Site">
    <a href="about.html">About</a>
  </nav>

  <div class="wrap">
    <header>
      <div class="brand">
        <img src="assets/logo.png" alt="Dead Simple logo" />
        <h1>Dead Simple</h1>
      </div>
      <hr class="accent-rule" aria-hidden="true" />
      <p class="tagline">Clarity in a noisy market</p>
      <p class="subline">No hype. No noise. Just signal.</p>
    </header>

    <section class="track-record" id="trackRecord" aria-label="Track record" hidden></section>

    <nav class="tabs" aria-label="Positions">
      <button class="tab active" data-bucket="open">Open <span class="count" data-count="open"></span></button>
      <button class="tab" data-bucket="watchlist">Watchlist <span class="count" data-count="watchlist"></span></button>
      <button class="tab" data-bucket="closed">Closed <span class="count" data-count="closed"></span></button>
    </nav>

    <main class="gallery" id="gallery" aria-live="polite"></main>

    <footer>
      <nav class="links" aria-label="Site and social channels">
        <a href="about.html">About</a>
        <a href="https://www.youtube.com/@deadsimplehq" rel="noopener" target="_blank">YouTube</a>
        <a href="https://www.tiktok.com/@deadsimplehq" rel="noopener" target="_blank">TikTok</a>
        <a href="https://x.com/DeadSimpleMoney" rel="noopener" target="_blank">X</a>
        <a href="https://deadsimplehq.substack.com" rel="noopener" target="_blank">Substack</a>
      </nav>
      <p class="foot-note">Every card is graded at publish and tracked against the S&amp;P 500 from that day forward. This is not financial advice &mdash; it&rsquo;s meant to supplement, not replace, your own research.</p>
    </footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Card viewer">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
    <iframe id="lightboxFrame" title="Card" loading="lazy"></iframe>
  </div>

  <script>
    const BUCKETS = ["open", "watchlist", "closed"];
    const EMPTY = {
      open: "No open positions yet.",
      watchlist: "Nothing on the watchlist yet.",
      closed: "No closed positions yet."
    };
    let DATA = null;
    let active = "open";

    function alphaClass(a) {
      if (!a || a === "\u2014") return "flat";
      if (a.trim().startsWith("-")) return "neg";
      if (a.trim().startsWith("+")) return "pos";
      return "flat";
    }

    // Parse a percent string like "+3.2%" / "-6.4%" / "\u2014" into a number (or null).
    function pct(s) {
      if (!s || s === "\u2014") return null;
      const n = parseFloat(String(s).replace(/[+%\s]/g, ""));
      return Number.isFinite(n) ? n : null;
    }

    function tile(item) {
      const dir = item.dir || item.ticker;
      const alpha = item.alpha || "\u2014";
      const isClosed = (item.status || "").toLowerCase() === "closed"
        || (item.performance_mode || "") === "frozen";
      const ret = item.current_return || "\u2014";
      const right = isClosed
        ? `<span class="tile-alpha-label">Return @ Close</span>
           <span class="tile-ret ${alphaClass(ret)}">${ret}</span>`
        : `<span class="tile-sub">${item.research_date || ""}</span>`;
      const a = document.createElement("a");
      a.className = "tile";
      a.href = `cards/${dir}/card.html`;
      a.innerHTML = `
        <img src="cards/${dir}/card_front_web.png" alt="${item.ticker} card" loading="lazy" />
        <div class="tile-meta">
          <span>
            <span class="tile-alpha-label">Alpha vs S&amp;P</span>
            <span class="tile-alpha ${alphaClass(alpha)}">${alpha}</span>
          </span>
          <span class="right">${right}</span>
        </div>`;
      a.addEventListener("click", (e) => {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; // let new-tab work
        e.preventDefault();
        openLightbox(`cards/${dir}/card.html`);
      });
      return a;
    }

    // Public scoreboard: count actual positions (open + closed), their average
    // alpha, and how many are beating the S&P. Watchlist names are not calls.
    function renderTrackRecord() {
      const strip = document.getElementById("trackRecord");
      if (!DATA) { strip.hidden = true; return; }
      const positions = [...(DATA.open || []), ...(DATA.closed || [])];
      const alphas = positions.map(p => pct(p.alpha)).filter(v => v !== null);
      if (alphas.length === 0) { strip.hidden = true; return; }
      const avg = alphas.reduce((s, v) => s + v, 0) / alphas.length;
      const beating = alphas.filter(v => v > 0).length;
      const avgCls = avg > 0 ? "pos" : (avg < 0 ? "neg" : "");
      const fmt = v => `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`;
      strip.innerHTML = `
        <div class="stat"><span class="v">${positions.length}</span><span class="k">Positions Tracked</span></div>
        <div class="stat"><span class="v ${avgCls}">${fmt(avg)}</span><span class="k">Avg Alpha vs S&amp;P</span></div>
        <div class="stat"><span class="v">${beating}<span style="color:var(--faint);font-weight:400"> / ${alphas.length}</span></span><span class="k">Beating the S&amp;P</span></div>`;
      strip.hidden = false;
    }

    // Lightbox -----------------------------------------------------------------
    const lightbox = document.getElementById("lightbox");
    const lightboxFrame = document.getElementById("lightboxFrame");
    function openLightbox(src) {
      lightboxFrame.src = src;
      lightbox.classList.add("open");
      document.body.classList.add("no-scroll");
      document.getElementById("lightboxClose").focus();
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.classList.remove("no-scroll");
      lightboxFrame.src = "";  // stop the iframe so a reopen starts fresh
    }
    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.classList.contains("open")) closeLightbox();
    });

    function render() {
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      if (!DATA) {
        gallery.style.display = "block";
        gallery.innerHTML = `<div class="empty"><strong>Cards are on their way.</strong>Publish from the research engine to populate this page.</div>`;
        return;
      }

      const items = DATA[active] || [];
      if (items.length === 0) {
        gallery.style.display = "block";
        gallery.innerHTML = `<div class="empty"><strong>${EMPTY[active]}</strong></div>`;
        return;
      }
      gallery.style.display = "grid";
      items.forEach(item => gallery.appendChild(tile(item)));
    }

    function setActive(bucket) {
      active = bucket;
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.bucket === bucket);
      });
      render();
    }

    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => setActive(t.dataset.bucket));
    });

    fetch("cards/index.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        DATA = data;
        BUCKETS.forEach(b => {
          const el = document.querySelector(`[data-count="${b}"]`);
          const n = (data.counts && data.counts[b]) || (data[b] ? data[b].length : 0);
          if (el) el.textContent = n;
        });
        renderTrackRecord();
        render();
      })
      .catch(() => { DATA = null; render(); });

    render();
  </script>
</body>
</html>
